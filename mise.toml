# Project tools. Secrets go in mise.local.toml, which git ignores.
[tools]
node = "24.22.2"
# Browser automation for agents (see AGENTS.md). Pinned so the CLI and its bundled skill guides match.
"npm:agent-browser" = "0.41.2"

[tasks.install]
description = "Install dependencies exactly as locked"
run = "npm ci"

[tasks.dev]
description = "Run the server (dev identity from mise.local.toml) and web app"
run = ["npm run dev:server & npm run dev:web; wait"]

[tasks.test]
description = "Typecheck and run the tests"
run = ["npm run typecheck", "npm test"]
